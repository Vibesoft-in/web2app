# ==============================================================================
# Hardened Production Nginx Configuration: WebIntoApp
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_zone:20m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=build_zone:10m rate=5r/m;
limit_req_status 429;

# Upstream Backend (PHP-FPM)
upstream backend_fpm {
    server app:9000;
    keepalive 32;
}

# Upstream Dashboard (Next.js)
upstream dashboard_upstream {
    server dashboard:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirection Server Block
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.webintoapp.com api.webintoapp.com admin.webintoapp.com;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Hardened Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.webintoapp.com api.webintoapp.com admin.webintoapp.com;

    # Document Root for Laravel API & Filament Admin
    root /var/www/backend/public;
    index index.php index.html;

    # SSL/TLS Modern Hardened Configuration
    ssl_certificate /etc/nginx/ssl/live/webintoapp.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/webintoapp.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Production Security Headers
    # --------------------------------------------------------------------------
    # HSTS: 2 years, include subdomains, preloaded
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent Clickjacking / UI Redressing
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Strict Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict Browser Hardware & Web APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://checkout.razorpay.com')" always;

    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://api.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.razorpay.com https://*.ingest.sentry.io https://fcm.googleapis.com; frame-src 'self' https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Disable server tokens
    server_tokens off;

    # Request Buffer Limits to prevent buffer overflow attacks
    client_max_body_size 32M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Health Probe Endpoints (Bypasses rate limiting)
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /api/health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Internal FastCGI status & ping (Restricted to localhost/docker network)
    location ~ ^/(status|ping)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        fastcgi_pass backend_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --------------------------------------------------------------------------
    # Authentication & OTP Endpoints (Strict Rate Limiting)
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/auth/(send-otp|verify-otp|google) {
        limit_req zone=auth_zone burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # General API Routes (/api/* & /v1/*)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /v1/ {
        limit_req zone=api_zone burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # Filament Admin Panel (/admin/*)
    # --------------------------------------------------------------------------
    location /admin {
        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # Static Assets (Images, Icons, Uploads)
    # --------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Deny access to hidden dotfiles (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # FastCGI PHP Execution
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY ""; # Mitigate httpoxy vulnerability
        include fastcgi_params;

        # FastCGI buffer tuning
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_intercept_errors off;
    }

    # Default fallback to Laravel router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
