# ==============================================================================
# Supervisor Configuration: Laravel Queue Workers & Scheduler
# ==============================================================================

# High & Default Priority Workers
[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work redis --queue=high,default --sleep=3 --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600 --rest=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=95

# Notifications & WhatsApp Workers
[program:laravel-worker-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work redis --queue=notifications --sleep=2 --tries=3 --timeout=120 --max-jobs=500 --max-time=3600 --rest=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-notifications.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=125

# Build & Release Preparation Workers
[program:laravel-worker-builds]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work redis --queue=builds --sleep=5 --tries=1 --timeout=1800 --max-jobs=50 --max-time=7200 --rest=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-builds.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=1805

# Laravel Task Scheduler Worker (Continually runs schedule:run every minute)
[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do (php /var/www/backend/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stopwaitsecs=60
