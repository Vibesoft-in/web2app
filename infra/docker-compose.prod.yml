version: '3.8'

# ==============================================================================
# Hardened Production Docker Compose Stack: WebIntoApp
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Laravel PHP 8.3 FPM Application Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.backend
    container_name: webintoapp_backend
    restart: always
    working_dir: /var/www/backend
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=daily
      - LOG_LEVEL=error
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - shared_storage:/var/www/backend/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. Hardened Nginx Reverse Proxy & Static Asset Server
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: webintoapp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
      - shared_storage:/var/www/backend/storage:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. Next.js 14 Production Dashboard
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: webintoapp_dashboard
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.webintoapp.com
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. Supervisor Queue Worker & Scheduler Service
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: webintoapp_worker
    restart: always
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - shared_storage:/var/www/backend/storage
      - build_artifacts:/builds/artifacts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - build_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  # ----------------------------------------------------------------------------
  # 5. Sandboxed & Isolated Flutter Android Build Worker
  # ----------------------------------------------------------------------------
  build_worker:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.build-worker
    container_name: webintoapp_build_worker
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - build_artifacts:/builds/artifacts
      - build_workspace:/builds/workspace
    networks:
      - build_net # Strictly isolated from backend database & internal storage!
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 6. MySQL 8.0 Relational Database (Internal Only)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: webintoapp_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-webintoapp}
      MYSQL_USER: ${DB_USERNAME:-webintoapp}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - backup_volume:/backups
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-webintoapp}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 7. Redis 7 In-Memory Cache, Queue, and Session Broker (Internal Only)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: webintoapp_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

# ------------------------------------------------------------------------------
# Isolated Network Topologies
# ------------------------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  build_net:
    driver: bridge
    internal: false # Requires external egress for flutter/gradle dependencies, but internal to db

# ------------------------------------------------------------------------------
# Persistent Volume Manifest
# ------------------------------------------------------------------------------
volumes:
  mysql_prod_data:
  redis_prod_data:
  shared_storage:
  build_artifacts:
  build_workspace:
  backup_volume:
