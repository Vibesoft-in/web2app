services:
  app:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: webintoapp_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-webintoapp}
      - DB_USERNAME=${DB_USERNAME:-webintoapp}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      - mysql
      - redis
      - mailpit
    networks:
      - webintoapp_network

  web:
    image: nginx:alpine
    container_name: webintoapp_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webintoapp_network

  mysql:
    image: mysql:8.0
    container_name: webintoapp_mysql
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-webintoapp}
      MYSQL_USER: ${DB_USERNAME:-webintoapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - webintoapp_network

  redis:
    image: redis:7-alpine
    container_name: webintoapp_redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    networks:
      - webintoapp_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: webintoapp_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - webintoapp_network

networks:
  webintoapp_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
