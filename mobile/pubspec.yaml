name: webintoapp_engine
description: "White-label Flutter engine for WebIntoApp multi-tenant SaaS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  go_router: ^14.1.4
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  webview_flutter: ^4.7.0
  hive_flutter: ^1.1.0
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
